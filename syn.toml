# A Vela (Horizen) app in Synsema as a recipe: the entry is the workbench (web.syn), a web app that
# embeds app/app.syn into the release's guest module, deploys it to Vela and drives it from the
# browser: register, deposit, any payload encrypted to the Executor, your events decrypted, the
# public events, reports, users registered through the facilitator. This file only says what the
# code cannot say about itself; the `require` blocks are the manifests of capabilities. The CLI in
# client/ does the same from a terminal, on the same library.

name = "Vela app"
slug = "vela-app"
version = "0.2.3"
kind = "web"
entry = "web.syn"
engine = "0.6"
tagline = "A confidential app for Horizen's Vela, in Synsema: the guest, its tests, and a workbench for the other side of the enclave."
tagline_es = "Una app confidencial para Vela (Horizen) en Synsema: el guest, sus tests y una mesa de trabajo para el otro lado del enclave."
tagline_pt = "Um app confidencial para o Vela (Horizen) em Synsema: o guest, seus testes e uma bancada para o outro lado do enclave."

[secrets]
VELA_SECP_KEY = "the secp256k1 key that signs the transactions and pays the fees (hex). On the public devnet the token comes with an account of its own: a deployer with ETH and test tokens."
VELA_ADMIN_KEY = "the admin key when the kit signs allow-token and allow-authority itself (a devnet of your own). Empty on the public devnet, whose admin desk signs them (VELA_ADMIN_URL), and on a local kit, where the signing key is the admin."
VELA_P521_KEY = "P-521 private key for the encrypted channel with the Executor (hex). Provisioned on the devnet; made by the app itself when empty."

# The public Vela devnet by default: the provision URL hands out a token of your own and fills these
# (and the keys) when the project is created. Point them at your own Vela stack to leave the devnet.
[env]
VELA_RPC_URL = "https://devnet.synsema.app/<token>/rpc"
VELA_AUTHORITY_URL = "https://devnet.synsema.app/<token>/authority"
VELA_SUBGRAPH_URL = "https://devnet.synsema.app/<token>/subgraph/subgraphs/name/hcce"
VELA_PROCESSOR = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
VELA_TEE_AUTHENTICATOR = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
VELA_MAX_FEE = "100"

[provision]
env_url = "https://devnet.synsema.app/token"

# the app's state: the app id, the keys it made, the users, the last report, the cached guest
[volumes]
data = "./data"
